<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="한국어 마크다운을 실시간으로 HTML로 변환하고 복사·다운로드할 수 있는 프리미엄 정적 웹 저작 도구"
    />
    <title>마크다운 ➔ HTML 변환기 | Premium Editor</title>

    <!-- Google Fonts & Pretendard Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css"
    />
    
    <!-- Code Highlight CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css"
      id="hljs-light"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css"
      id="hljs-dark"
      disabled
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Premium Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark-wrapper">
          <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="12" fill="url(#brand-grad)" />
            <path d="M10 28V12L15 20L20 12V28" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M26 14H32M29 14V26M26 26H32" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M22 20H25" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <defs>
              <linearGradient id="brand-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#8b5cf6" />
                <stop offset="1" stop-color="#6366f1" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-title">
          <h1>마크다운 변환기</h1>
          <span class="brand-badge">Premium Editor</span>
        </div>
      </div>

      <!-- App Header Toolbar Controls -->
      <nav class="header-actions" aria-label="도구 모음">
        <div class="custom-select-wrapper">
          <select id="template-select" class="select-input select-template" aria-label="마크다운 템플릿 선택">
            <option value="" disabled selected>문서 템플릿 선택...</option>
            <option value="basic">기본 가이드</option>
            <option value="resume">이력서 / 포트폴리오</option>
            <option value="report">보고서 / 회의록</option>
            <option value="blog">블로그 포스트</option>
          </select>
        </div>

        <button type="button" id="import-btn" class="btn btn-ghost" title="마크다운 파일 가져오기">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-8m0 8l-4-4m4 4l4-4M4 17v1a2 2 0 002 2h12a2 2 0 002-2v-1" />
          </svg>
          가져오기
        </button>
        <input type="file" id="file-input" accept=".md,.txt,.markdown" style="display: none;" />

        <button type="button" id="clear-input" class="btn btn-ghost" title="입력값 초기화">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          초기화
        </button>

        <button
          type="button"
          id="toggle-theme"
          class="btn btn-icon-only"
          aria-pressed="false"
          aria-label="다크 모드 전환"
          title="다크 모드 전환"
        >
          <span class="theme-icon-wrapper">
            <svg class="icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707-.707M12 7a5 5 0 100 10 5 5 0 000-10z" />
            </svg>
            <svg class="icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </span>
        </button>
      </nav>
    </header>

    <!-- Main Workspace Area -->
    <main class="workspace" id="workspace">
      <!-- Left Editor Pane -->
      <section class="pane pane-input" id="pane-input" aria-label="마크다운 입력">
        <header class="pane-header">
          <div class="pane-title-group">
            <svg class="pane-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            <h2>마크다운 입력</h2>
          </div>
          <button type="button" class="btn btn-icon-only btn-fullscreen" data-target="pane-input" title="전체화면 전환">
            <svg class="icon icon-maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4h4m12 4V4h-4M4 16v4h4m12-4v4h-4" />
            </svg>
            <svg class="icon icon-minimize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4h6v6m10-6h-6v6M4 20h6v-6m10 6h-6v-6" />
            </svg>
          </button>
        </header>

        <div class="editor-area">
          <textarea
            id="markdown-input"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            placeholder="이곳에 마크다운 문서를 입력하세요. 실시간으로 변환이 진행됩니다…"
          ></textarea>
        </div>

        <footer class="pane-footer-stats">
          <div class="stat-item" title="총 글자 수 (공백 포함)">
            <span class="stat-label">글자수</span>
            <span class="stat-val" id="stat-chars">0</span>
          </div>
          <div class="stat-item" title="총 단어 수 (공백 구분)">
            <span class="stat-label">단어수</span>
            <span class="stat-val" id="stat-words">0</span>
          </div>
          <div class="stat-item" title="총 줄 수">
            <span class="stat-label">라인수</span>
            <span class="stat-val" id="stat-lines">0</span>
          </div>
          <div class="stat-item" title="한국어 읽기 속도 (분당 약 300자 기준) 반영">
            <span class="stat-label">읽기속도</span>
            <span class="stat-val" id="stat-time">1분 미만</span>
          </div>
        </footer>
      </section>

      <!-- Draggable Split Separator Divider -->
      <div class="split-divider" id="split-divider" role="separator" aria-valuenow="50" aria-valuemin="20" aria-valuemax="80" aria-label="화면 크기 비율 조절">
        <div class="split-divider-line"></div>
        <div class="split-divider-handle" title="드래그하여 크기 조절">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 9h2V7H8v2zm0 4h2v-2H8v2zm0 4h2v-2H8v2zm6-10h-2v2h2V7zm0 4h-2v2h2v-2zm0 4h-2v2h2v-2z" />
          </svg>
        </div>
      </div>

      <!-- Right Output Display Pane -->
      <section class="pane pane-output" id="pane-output" aria-label="변환 결과">
        <header class="pane-header pane-header-output">
          <div class="output-header-left">
            <div class="tabs" role="tablist" aria-label="출력 형식">
              <button
                type="button"
                class="tab is-active"
                role="tab"
                aria-selected="true"
                data-tab="preview"
                id="tab-preview"
              >
                미리보기
              </button>
              <button
                type="button"
                class="tab"
                role="tab"
                aria-selected="false"
                data-tab="source"
                id="tab-source"
              >
                HTML 소스
              </button>
            </div>
            
            <!-- Output theme selector (visible on preview tab) -->
            <div class="theme-selector-box" id="theme-selector-box">
              <select id="preview-theme-select" class="select-input select-theme" title="미리보기 문서 스타일 테마 선택">
                <option value="github">GitHub 스타일</option>
                <option value="minimalist">모던 미니멀</option>
                <option value="sepia">따뜻한 세피아</option>
                <option value="serif">클래식 세리프</option>
              </select>
            </div>
          </div>

          <div class="output-actions">
            <button type="button" id="copy-html" class="btn btn-ghost" title="HTML 코드 클립보드에 복사">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              HTML 복사
            </button>
            <button type="button" id="copy-rich" class="btn btn-ghost" title="서식 있는 텍스트로 복사 (노션, 워드, Gmail 붙여넣기용)">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
              </svg>
              서식 복사
            </button>
            <button type="button" id="download-html" class="btn btn-primary" title="변환된 HTML 파일 다운로드">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
              다운로드
            </button>
            <button type="button" class="btn btn-icon-only btn-fullscreen" data-target="pane-output" title="전체화면 전환">
              <svg class="icon icon-maximize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4h4m12 4V4h-4M4 16v4h4m12-4v4h-4" />
              </svg>
              <svg class="icon icon-minimize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4h6v6m10-6h-6v6M4 20h6v-6m10 6h-6v-6" />
              </svg>
            </button>
          </div>
        </header>

        <div class="output-content">
          <article
            id="preview"
            class="preview is-active theme-github"
            role="tabpanel"
            aria-labelledby="tab-preview"
            tabindex="0"
          ></article>
          <pre
            id="source"
            class="source"
            role="tabpanel"
            aria-labelledby="tab-source"
            tabindex="0"
            hidden
          ><code class="language-html" id="source-code"></code></pre>
        </div>
      </section>
    </main>

    <!-- App Footer -->
    <footer class="app-footer">
      <div class="footer-info">
        <span>GFM 공식 사양 지원 · XSS 완벽 방어 · 4가지 스타일 프리셋 탑재</span>
      </div>
      <a
        href="https://github.com/cskwork/markdown-to-html-kr"
        id="repo-link"
        rel="noopener"
        target="_blank"
        class="footer-repo-link"
      >
        <svg class="icon github-icon" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.579.688.481C19.137 20.162 22 16.418 22 12c0-5.523-4.477-10-10-10z" />
        </svg>
        GitHub Repository
      </a>
    </footer>

    <!-- Glowing toast notification -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Scripts from JSdelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/css.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/xml.min.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
