<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="한국어 마크다운을 실시간으로 HTML로 변환하고 복사·다운로드할 수 있는 정적 웹 도구"
    />
    <title>마크다운 → HTML 변환기</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css"
      id="hljs-light"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css"
      id="hljs-dark"
      disabled
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">M↦H</span>
        <h1>마크다운 → HTML 변환기</h1>
      </div>
      <nav class="header-actions" aria-label="도구 모음">
        <button type="button" id="load-sample" class="btn btn-ghost">
          샘플 불러오기
        </button>
        <button type="button" id="clear-input" class="btn btn-ghost">
          초기화
        </button>
        <button
          type="button"
          id="toggle-theme"
          class="btn btn-icon-only"
          aria-pressed="false"
          aria-label="다크 모드 전환"
          title="다크 모드 전환"
        >
          <span class="theme-icon" aria-hidden="true">☾</span>
          <span class="theme-label sr-only">다크 모드</span>
        </button>
      </nav>
    </header>

    <main class="workspace" id="workspace">
      <section class="pane pane-input" aria-label="마크다운 입력">
        <header class="pane-header">
          <h2>마크다운 입력</h2>
          <span class="char-count" id="char-count">0자</span>
        </header>
        <textarea
          id="markdown-input"
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          placeholder="여기에 마크다운을 입력하세요…"
        ></textarea>
      </section>

      <section class="pane pane-output" aria-label="변환 결과">
        <header class="pane-header pane-header-output">
          <div
            class="tabs"
            role="tablist"
            aria-label="출력 형식"
          >
            <button
              type="button"
              class="tab is-active"
              role="tab"
              aria-selected="true"
              data-tab="preview"
              id="tab-preview"
            >
              미리보기
            </button>
            <button
              type="button"
              class="tab"
              role="tab"
              aria-selected="false"
              data-tab="source"
              id="tab-source"
            >
              HTML 소스
            </button>
          </div>
          <div class="output-actions">
            <button type="button" id="copy-html" class="btn btn-ghost">
              <span aria-hidden="true" class="btn-icon">⧉</span> 복사
            </button>
            <button type="button" id="download-html" class="btn btn-primary">
              <span aria-hidden="true" class="btn-icon">↓</span> 다운로드
            </button>
          </div>
        </header>
        <article
          id="preview"
          class="preview is-active"
          role="tabpanel"
          aria-labelledby="tab-preview"
          tabindex="0"
        ></article>
        <pre
          id="source"
          class="source"
          role="tabpanel"
          aria-labelledby="tab-source"
          tabindex="0"
          hidden
        ><code class="language-html" id="source-code"></code></pre>
      </section>
    </main>

    <footer class="app-footer">
      <span>GFM 지원 · 표·코드블록·체크박스 · 정적 호스팅</span>
      <a
        href="https://github.com/"
        id="repo-link"
        rel="noopener"
        target="_blank"
        >GitHub에서 보기</a
      >
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/css.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/languages/xml.min.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
